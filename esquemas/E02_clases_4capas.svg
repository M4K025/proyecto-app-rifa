<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" font-family="Segoe UI,Arial">
<rect width="1200" height="680" rx="20" fill="#FAF7FF"/>
<text x="600" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#6D28D9">E02 · Diagrama de clases por capas (BACK dominio + ORM tablas)</text>
<text x="600" y="62" text-anchor="middle" font-size="12" fill="#8B8399">Morado = BACK dominio · Azul = ORM tabla espejo · Cada entidad tiene su tabla (POO de clase)</text>
<g font-size="12">
<!-- row1 -->
<g><rect x="30" y="90" width="260" height="230" rx="12" fill="#fff" stroke="#7C5CBF" stroke-width="2.5"/><rect x="30" y="90" width="260" height="34" rx="12" fill="#7C5CBF"/><text x="45" y="112" font-weight="800" fill="#fff">Usuario [BACK]</text><text x="45" y="140" font-weight="700">- id, nombre, correo</text><text x="45" y="158">- telefono, documento</text><text x="45" y="176">- rol: CLIENTE/ORG/…</text><text x="45" y="198" font-weight="700">+ registrar()</text><text x="45" y="216">+ iniciar_sesion()</text><text x="45" y="238" fill="#1D4ED8">ORM→ tabla usuarios</text><text x="45" y="256" fill="#1D4ED8">RepoUsuarios.guardar()</text><text x="45" y="278" fill="#1D4ED8">1 — * Compra</text></g>
<g><rect x="310" y="90" width="260" height="230" rx="12" fill="#fff" stroke="#7C5CBF" stroke-width="2.5"/><rect x="310" y="90" width="260" height="34" rx="12" fill="#7C5CBF"/><text x="325" y="112" font-weight="800" fill="#fff">Rifa $900.000 [BACK]</text><text x="325" y="140" font-weight="700">- titulo, objetivo</text><text x="325" y="158">- monto_recaudado</text><text x="325" y="176">- estado: ACTIVA/…</text><text x="325" y="198" font-weight="700">+ crear(), abonar()</text><text x="325" y="216">+ verificar_meta()</text><text x="325" y="238" fill="#1D4ED8">ORM→ tabla rifas</text><text x="325" y="256" fill="#1D4ED8">1 — * Boleto</text><text x="325" y="278" fill="#1D4ED8">1 — 1 Sorteo/Meta</text></g>
<g><rect x="590" y="90" width="260" height="230" rx="12" fill="#fff" stroke="#7C5CBF" stroke-width="2.5"/><rect x="590" y="90" width="260" height="34" rx="12" fill="#7C5CBF"/><text x="605" y="112" font-weight="800" fill="#fff">Boleto [BACK]</text><text x="605" y="140" font-weight="700">- numero, precio</text><text x="605" y="158">- estado: DISP/APART/…</text><text x="605" y="176">- rifa_id, comprador_id</text><text x="605" y="198" font-weight="700">+ reservar()</text><text x="605" y="216">+ marcar_vendido()</text><text x="605" y="238" fill="#1D4ED8">ORM→ tabla boletos</text><text x="605" y="256" fill="#1D4ED8">* — 1 Rifa</text></g>
<g><rect x="870" y="90" width="260" height="230" rx="12" fill="#fff" stroke="#7C5CBF" stroke-width="2.5"/><rect x="870" y="90" width="260" height="34" rx="12" fill="#7C5CBF"/><text x="885" y="112" font-weight="800" fill="#fff">Compra [BACK]</text><text x="885" y="140" font-weight="700">- usuario_id, total</text><text x="885" y="158">- metodo: EFECTIVO/…</text><text x="885" y="176">- estado: PEND/CONF</text><text x="885" y="198" font-weight="700">+ calcular_total()</text><text x="885" y="216">+ confirmar()/anular()</text><text x="885" y="238" fill="#1D4ED8">ORM→ compras+join</text><text x="885" y="256" fill="#1D4ED8">1 — * Boleto/Pago</text></g>
<!-- row2 -->
<g><rect x="30" y="340" width="260" height="200" rx="12" fill="#fff" stroke="#8EA7E9" stroke-width="2"/><rect x="30" y="340" width="260" height="34" rx="12" fill="#8EA7E9"/><text x="45" y="362" font-weight="800" fill="#fff">Pago [BACK]</text><text x="45" y="390">- compra_id, monto</text><text x="45" y="408">- referencia, estado</text><text x="45" y="430" font-weight="700">+ aprobar()/rechazar()</text><text x="45" y="452" fill="#1D4ED8">ORM→ tabla pagos</text></g>
<g><rect x="310" y="340" width="260" height="200" rx="12" fill="#fff" stroke="#8EA7E9" stroke-width="2"/><rect x="310" y="340" width="260" height="34" rx="12" fill="#8EA7E9"/><text x="325" y="362" font-weight="800" fill="#fff">Sorteo [BACK]</text><text x="325" y="390">- rifa_id, fecha</text><text x="325" y="408">- ganador_boleto_id</text><text x="325" y="430" font-weight="700">+ realizar_sorteo()</text><text x="325" y="452" fill="#1D4ED8">ORM→ tabla sorteos</text></g>
<g><rect x="590" y="340" width="260" height="200" rx="12" fill="#fff" stroke="#8EA7E9" stroke-width="2"/><rect x="590" y="340" width="260" height="34" rx="12" fill="#8EA7E9"/><text x="605" y="362" font-weight="800" fill="#fff">MetaRecaudacion</text><text x="605" y="390">- rifa_id, meta $900k</text><text x="605" y="408">- monto_actual</text><text x="605" y="430" font-weight="700">+ porcentaje()</text><text x="605" y="452" fill="#1D4ED8">ORM→ tabla metas</text></g>
<g><rect x="870" y="340" width="260" height="200" rx="12" fill="#fff" stroke="#E5989B" stroke-width="2"/><rect x="870" y="340" width="260" height="34" rx="12" fill="#E5989B"/><text x="885" y="362" font-weight="800" fill="#fff">Reporte/Comprob.</text><text x="885" y="390">- rifa_id/compra_id</text><text x="885" y="408">- tipo, contenido/QR</text><text x="885" y="430" font-weight="700">+ generar()/exportar()</text><text x="885" y="452" fill="#1D4ED8">ORM→ reportes</text></g>
</g>
<text x="600" y="580" text-anchor="middle" font-size="13" fill="#4C4356">FRONTEND usa estas clases solo para mostrar · API las transporta en DTOs · BACK tiene las reglas · ORM las guarda en SQLite</text>
<text x="600" y="604" text-anchor="middle" font-size="13" fill="#4C4356">Enums: RolUsuario · EstadoRifa · EstadoBoleto · EstadoCompra · MetodoPago · EstadoPago · TipoReporte</text>
<text x="600" y="640" text-anchor="middle" font-size="12" fill="#8B8399">Archivo E02 — enviar a compañeros · Corresponde a src/rifa_app/back/dominio/ + src/rifa_app/orm/</text>
</svg>
